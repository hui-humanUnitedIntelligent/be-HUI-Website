<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!--
      ══ Routing-Fix: Base href ════════════════════════════════════
      Vite build nutzt base: './' → erzeugt relative Pfade (./assets/...).
      Beim Reload auf /app/Home wuerde der Browser ./assets/web-*.js
      zu /app/assets/web-*.js aufloesen — die Vercel-Regel /app(.*)
      liefert dann web.html statt JS → MIME-Fehler → App bricht ab.

      <base href="/"> erzwingt, dass ALLE relativen URLs von / aufgeloest
      werden. ./assets/web-*.js → /assets/web-*.js (korrekt).
      BrowserRouter basename="/app" nutzt window.location.pathname
      (unabhaengig von <base>) → Routing bleibt korrekt.
    -->
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- HUI Web — Primary Meta -->
    <title>HUI Web — Human United Intelligence</title>
    <meta name="description" content="HUI — Ein ruhiges kreatives Netzwerk fuer Menschen die wirken. Verbinde dich mit kreativen Talenten, buche Zusammenarbeit, gestalte Impact." />
    <meta name="theme-color" content="#0DC4B5" />
    <meta name="application-name" content="HUI Web" />

    <!-- Favicon (shared with mobile app) -->
    <link rel="icon" href="./favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png?v=2" />
    <link rel="icon" type="image/png" href="./favicon.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=2" />

    <!-- OpenGraph -->
    <meta property="og:title" content="HUI — Human United Intelligence" />
    <meta property="og:description" content="Ein ruhiges kreatives Netzwerk fuer Menschen die wirken." />
    <meta property="og:type" content="website" />

    <!-- No cache for entry file -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <script type="module" crossorigin src="./assets/web-Cib4wxfQ.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/style-B3EKPF7v.css">
  </head>
  <body>
    <div id="web-root"></div>
  </body>
</html>
