name: Run Migration 083 — Feed RPC

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/rpc_home_feed_083.sql'
      - '.github/workflows/run-migration-083.yml'

concurrency:
  group: run-migration-083
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        run: |
          curl -fsSL https://github.com/supabase/cli/releases/download/v2.108.0/supabase_linux_amd64.tar.gz | tar -xz -C /tmp
          sudo mv /tmp/supabase /usr/local/bin/supabase
          supabase --version

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref gxztrhvhcxhmunhhkfjd --yes

      - name: Run rpc_home_feed migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          awk '/^COMMIT;/{print; exit} {print}' scripts/rpc_home_feed_083.sql > /tmp/migration_083.sql
          supabase db query --linked -f /tmp/migration_083.sql

      - name: PostgREST schema reload
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase db query --linked "NOTIFY pgrst, 'reload schema';"
          sleep 5

      - name: Verify RPC functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase db query --linked "SELECT proname FROM pg_proc WHERE proname IN ('rpc_home_feed','rpc_feed_card_meta') ORDER BY proname;" -o json
